{% extends "base.html" %}
{% block title %}Login — Placement Portal{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-card">
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Select your role and sign in</p>

    <!-- Role Tabs -->
    <div class="role-tabs" id="roleTabs">
        <button class="role-tab active" data-role="student" type="button">
            <span class="tab-icon">🎓</span> Student
        </button>
        <button class="role-tab" data-role="company" type="button">
            <span class="tab-icon">🏢</span> Company
        </button>
        <button class="role-tab" data-role="college" type="button">
            <span class="tab-icon">🏫</span> College
        </button>
        <button class="role-tab" data-role="faculty" type="button">
            <span class="tab-icon">👨‍🏫</span> Faculty
        </button>
    </div>

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
        <input type="hidden" name="role" id="selectedRole" value="student">

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required
                autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
            Sign In as <span id="roleLabel">Student</span>
        </button>
    </form>

    <p class="auth-footer">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
